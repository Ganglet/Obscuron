# Historical/current reference-database snapshot pair used for retrospective
# (temporal) validation — see blueprint §2.5 and §7.
#
# TODO(Angshuman): confirm or override this pair. See docs/reproducibility.md
# for the tradeoffs. Recommended default below gives a ~4 year gap between
# GTDB releases, which is a reasonable starting point for estimating the
# retrospective positive-label set size (blueprint §7 go/no-go criterion).
#
# Note: Pfam is now folded into InterPro; 37.0 (June 2024) is the last
# standalone Pfam-A release. If a more recent "family added" signal is
# needed, InterPro release notes may be a better primary resource than Pfam
# going forward — flagged for Track 1 to decide.

historical:
  gtdb_release: "R207"   # April 2022
  pfam_release: "35.0"   # November 2021

current:
  gtdb_release: "R226"   # January 2026 (latest as of writing)
  pfam_release: "37.0"   # June 2024 (latest standalone Pfam-A release)

# Minimum viable positive-label set size before Phase 2 begins (blueprint §7).
go_no_go:
  min_positive_labels: 50
  target_positive_labels: 100
